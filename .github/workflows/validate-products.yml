name: Validate and sync products

on:
  push:
    branches: [main]
    paths:
      - 'data/products.json'
      - 'tools/validate-products.js'
      - 'tools/sync-products.js'
      - 'tools/check-products-sync.js'
      - '.github/workflows/validate-products.yml'
  pull_request:
    paths:
      - 'data/products.json'
      - 'tools/validate-products.js'
      - 'tools/sync-products.js'
      - 'tools/check-products-sync.js'
      - '.github/workflows/validate-products.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/validate-products.js

  sync:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/sync-products.js
      - name: Commit synced products.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.js
          if git diff --staged --quiet; then
            echo "products.js already up to date"
          else
            git commit -m "chore: sync products.js from products.json"
            git push
          fi
